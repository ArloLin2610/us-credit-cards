name: CI

# 推到 main 時由 deploy.yml 建置並發布；這裡只檢查 PR。
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 驗證資料
        run: node scripts/validate-data.mjs
      - name: 建置網站
        run: npx astro build
        env:
          SITE_URL: https://example.com
